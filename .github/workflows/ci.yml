name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked)
        run: cd backend && uv sync --frozen --extra dev

      - name: Lint (ruff — BLE001/B904/B023/F821/F811 gate)
        run: cd backend && uv run ruff check app

      - name: Verify BLE001 debt budget
        run: cd backend && uv run python scripts/check_ble001_budget.py

      - name: Verify dead-code budget (vulture)
        # --with keeps vulture out of uv.lock: it's a gate-only tool and the
        # budget model (only-decrease) tolerates minor version drift.
        run: cd backend && uv run --with 'vulture>=2.11' python scripts/check_dead_code.py

      - name: Verify file line budget (only-decrease)
        run: cd backend && uv run python scripts/check_file_lines.py

      - name: Verify OpenAPI schema is current
        run: |
          cd backend
          uv run python scripts/export_openapi.py ../frontend/src/types/openapi.json
          git diff --exit-code -- ../frontend/src/types/openapi.json

      - name: Verify domain import boundaries
        run: cd backend && uv run python scripts/check_domain_imports.py --phase=7

      - name: Verify offline eval regression gate
        run: cd backend && uv run python scripts/check_offline_eval_regression.py

      - name: Verify requirements.txt matches pyproject.toml
        run: |
          cd backend
          uv export --no-hashes --no-dev --no-emit-project --format requirements.txt > requirements.txt.generated
          diff -u requirements.txt requirements.txt.generated \
            || { echo "::error::requirements.txt is out of sync with pyproject.toml. Run 'uv lock && uv export --no-hashes --no-dev --no-emit-project --format requirements.txt -o requirements.txt' and commit."; exit 1; }

      - name: Run pytest with coverage
        run: cd backend && ./.venv/bin/pytest -q --cov=app --cov-fail-under=70

  frontend:
    name: Frontend Lint, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Lint
        run: cd frontend && npm run lint

      - name: Verify generated API types
        run: cd frontend && npm run check:api-types

      - name: Test
        run: cd frontend && npm test

      - name: E2E
        run: cd frontend && npm run e2e

      - name: Audit production dependencies
        run: cd frontend && npm audit --omit=dev

  auth-assistant:
    name: Auth Assistant Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: auth-assistant/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: cd auth-assistant && npm ci

      - name: Build frontend
        run: cd auth-assistant && npm run build

      - name: Test Rust commands
        run: cd auth-assistant/src-tauri && cargo test --locked

      - name: Build desktop binary
        run: cd auth-assistant && npm run tauri:build -- --no-bundle

  security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked)
        run: cd backend && uv sync --frozen --extra dev

      - name: Run pip-audit against installed environment
        run: cd backend && uv run --with pip-audit pip-audit
