name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pim
          POSTGRES_PASSWORD: pim
          POSTGRES_DB: pim_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pim -d pim_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked)
        run: cd backend && uv sync --frozen --extra dev

      - name: Lint (ruff — BLE001/B904/B023/F821/F811 gate)
        run: cd backend && uv run ruff check app

      - name: Verify BLE001 debt budget
        run: cd backend && uv run python scripts/check_ble001_budget.py

      - name: Verify dead-code budget (vulture)
        # Keep this gate deterministic: vulture rule changes alter the finding
        # count even when application code is unchanged.
        run: cd backend && uv run --with 'vulture==2.16' python scripts/check_dead_code.py

      - name: Verify file line budget (only-decrease)
        run: cd backend && uv run python scripts/check_file_lines.py

      - name: Verify OpenAPI schema is current
        run: |
          cd backend
          uv run python scripts/export_openapi.py ../frontend/src/types/openapi.json
          git diff --exit-code -- ../frontend/src/types/openapi.json

      - name: Verify domain import boundaries
        run: cd backend && uv run python scripts/check_domain_imports.py --phase=7

      - name: Validate architecture manifest
        run: cd backend && uv run python scripts/validate_architecture_manifest.py

      - name: Generate M6 release gate report
        if: always()
        run: |
          cd backend
          mkdir -p artifacts
          uv run python scripts/run_release_gate.py --output artifacts/release_gate.json || true

      - name: Verify offline eval regression gate
        run: cd backend && uv run python scripts/check_offline_eval_regression.py

      - name: Verify M0/M1 real bootstrap eval datasets (fail closed)
        run: cd backend && uv run python scripts/check_bootstrap_eval.py

      - name: Generate M2 formal eval report (fail closed)
        if: always()
        run: |
          cd backend
          uv run python scripts/run_formal_eval.py --output artifacts/formal_eval_report.json

      - name: Generate Web Clean formal eval report (fail closed)
        if: always()
        run: |
          cd backend
          mkdir -p artifacts
          if test -f tests/fixtures/web_clean_eval_1_0.jsonl \
            && test -f tests/fixtures/web_clean_eval_1_0_manifest.json; then
            uv run python scripts/run_web_clean_eval.py \
              tests/fixtures/web_clean_eval_1_0.jsonl \
              --tier web_clean_eval_1_0 \
              --manifest tests/fixtures/web_clean_eval_1_0_manifest.json \
              --output artifacts/web_clean_eval_report.json
          else
            uv run python -c 'import json; from pathlib import Path; Path("artifacts/web_clean_eval_report.json").write_text(json.dumps({"version":"web-clean-eval-v2","ok":False,"dataset_tier":"web_clean_eval_1_0","manifest_valid":False,"gate":{"result":"NO_GO","blockers":["formal Web Clean dataset or manifest is missing"]}}, indent=2) + "\n", encoding="utf-8")'
          fi

      - name: Generate M2 release eval artifact
        if: always()
        run: |
          cd backend
          web_clean_args=()
          if test -f artifacts/web_clean_eval_report.json; then
            web_clean_args=(--web-clean-report artifacts/web_clean_eval_report.json)
          fi
          if test -f artifacts/formal_eval_report.json; then
            uv run python scripts/generate_release_eval_artifact.py \
              --formal-report artifacts/formal_eval_report.json \
              "${web_clean_args[@]}" \
              --output artifacts/release_eval_artifact.json
          else
            uv run python scripts/generate_release_eval_artifact.py \
              "${web_clean_args[@]}" \
              --output artifacts/release_eval_artifact.json
          fi

      - name: Upload M2 eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-eval-artifacts
          path: backend/artifacts/*.json
          if-no-files-found: error

      - name: Verify requirements.txt matches pyproject.toml
        run: |
          cd backend
          uv export --no-hashes --no-dev --no-emit-project --format requirements.txt > requirements.txt.generated
          diff -u requirements.txt requirements.txt.generated \
            || { echo "::error::requirements.txt is out of sync with pyproject.toml. Run 'uv lock && uv export --no-hashes --no-dev --no-emit-project --format requirements.txt > requirements.txt' and commit."; exit 1; }

      - name: Run pytest with coverage
        env:
          PIM_TEST_POSTGRES_URL: postgresql+psycopg://pim:pim@127.0.0.1:5432/pim_contract
        run: cd backend && ./.venv/bin/pytest -q --cov=app --cov-fail-under=70

  frontend:
    name: Frontend Lint, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Lint
        run: cd frontend && npm run lint

      - name: Verify generated API types
        run: cd frontend && npm run check:api-types

      - name: Test
        run: cd frontend && npm test

      - name: E2E
        run: cd frontend && npm run e2e

      - name: Audit production dependencies
        run: cd frontend && npm run audit:production

  auth-assistant:
    name: Auth Assistant Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: auth-assistant/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: cd auth-assistant && npm ci

      - name: Verify dependencies are pinned
        run: cd auth-assistant && npm run check:pinned-deps

      - name: Build frontend
        run: cd auth-assistant && npm run build

      - name: Test Rust commands
        run: cd auth-assistant/src-tauri && cargo test --locked

      - name: Build desktop binary
        run: cd auth-assistant && npm run tauri:build -- --no-bundle

  security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked)
        run: cd backend && uv sync --frozen --extra dev

      - name: Run pip-audit against installed environment
        run: cd backend && uv run --with pip-audit pip-audit
