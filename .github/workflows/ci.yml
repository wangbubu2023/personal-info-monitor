name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked)
        run: cd backend && uv sync --frozen --extra dev

      - name: Lint (ruff — BLE001/B904/B023/F821/F811 gate)
        run: cd backend && uv run ruff check app

      - name: Verify domain import boundaries
        run: cd backend && uv run python scripts/check_domain_imports.py --phase=7

      - name: Verify requirements.txt matches pyproject.toml
        run: |
          cd backend
          uv export --no-hashes --no-dev --no-emit-project --format requirements.txt > requirements.txt.generated
          diff -u requirements.txt requirements.txt.generated \
            || { echo "::error::requirements.txt is out of sync with pyproject.toml. Run 'uv lock && uv export --no-hashes --no-dev --no-emit-project --format requirements.txt -o requirements.txt' and commit."; exit 1; }

      - name: Run pytest with coverage
        run: cd backend && ./.venv/bin/pytest -q --cov=app --cov-fail-under=60

  frontend:
    name: Frontend Lint, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Test
        run: cd frontend && npm test

      - name: Audit production dependencies
        run: cd frontend && npm audit --omit=dev

  security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (locked)
        run: cd backend && uv sync --frozen --extra dev

      - name: Run pip-audit against installed environment
        run: cd backend && uv run --with pip-audit pip-audit
