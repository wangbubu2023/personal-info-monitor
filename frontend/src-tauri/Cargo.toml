[package]
name = "personal-info-monitor-tauri"
version = "1.1.1"
description = "Personal Info Monitor desktop shell"
authors = ["Personal Info Monitor"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "personal_info_monitor_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "personal-info-monitor-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.9", default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5"
shellexpand = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
