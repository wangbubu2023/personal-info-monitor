[package]
name = "pim-auth-assistant-tauri"
version = "1.6.4"
description = "PIM Auth Assistant desktop companion"
authors = ["Personal Info Monitor"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pim_auth_assistant_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pim-auth-assistant-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
